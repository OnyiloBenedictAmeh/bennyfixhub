<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BennyFix Hub Profile</title>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
/>
<link rel="icon" type="image/png" sizes="512x512" href="/bennyfix hub white-logo.png" />
  <link rel="stylesheet" href="user-profile.css">
</head>
<body class="profile-loading">

<div class="profile-page">
  <button
    id="profileBackBtn"
    class="back-btn"
    type="button"
    onclick="goBackFromProfile()"
  >
    ← Back
  </button>

  <!-- COVER -->
  <section class="profile-cover skeleton-block">
    <img id="coverImg" alt="Cover Photo">
  </section>

  <!-- PROFILE HEADER -->
  <section class="profile-header">
    <div class="profile-completion">

  <div class="progress-bar">
    <div
      id="profileProgress"
      class="progress-fill">
    </div>
  </div>

  <p id="profileProgressText">
    Profile Complete
  </p>

</div>

    <div class="avatar-wrap skeleton-avatar" >
  <img
    id="profileAvatar"
    class="avatar"
    alt="Profile Picture"
  >

  <div class="avatar-camera">
  <i class="fas fa-camera"></i>
</div>

</div>
<div class="profile-info">
  
  <h1 id="profileName" class="skeleton-text skeleton-title">
      </h1>

      <p id="profileBio" class="skeleton-text skeleton-line">
      </p>

      <div class="profile-meta">
        
        <span id="profileLocation" class="skeleton-text skeleton-chip">
        </span>

        <span id="profileJoined" class="skeleton-text skeleton-chip">
        </span>

      </div>

      <button
  id="editProfileBtn"
  class="primary-btn"
  onclick="openEditProfile()"
  >
  Edit Profile
</button>

    </div>

  </section>
  
  <input
    type="file"
    id="avatarFile"
    accept="image/*"
    hidden
  />
  
  
  <div id="cropModal" class="modal hidden">
    <div class="modal-box crop-box">
      <h3>Adjust Profile Photo</h3>
  
      <div class="crop-container">
        <img id="cropImage" />
      </div>
  
      <input
        type="range"
        id="zoomSlider"
        min="0.5"
        max="3"
        step="0.1"
        value="1"
      />
  
      <div class="crop-actions">
        <button onclick="closeCropper()">
          Cancel
        </button>
  
        <button onclick="cropAvatar()">
          Save Photo
        </button>
      </div>
    </div>
  </div>
  <!-- STATS -->
  <section class="stats-grid">

    <div class="stat-card">
      <h2 id="repairCount" class="skeleton-text skeleton-number">0</h2>
      <p>Repairs</p>
    </div>

    <div class="stat-card">
      <h2 id="completedCount" class="skeleton-text skeleton-number">0</h2>
      <p>Completed</p>
    </div>

    <div class="stat-card">
      <h2 id="claimCount" class="skeleton-text skeleton-number">0</h2>
      <p>Claims</p>
    </div>

    <div class="stat-card">
      <h2 id="hireCount" class="skeleton-text skeleton-number">0</h2>
      <p>Hire Requests</p>
    </div>

  </section>

  <!-- ACCOUNT INFO -->
  <section class="card">

    <h2>Account Information</h2>

    <div class="info-row">
      <span>Email</span>
      <strong id="profileEmail" class="skeleton-text skeleton-value"></strong>
    </div>

    <div class="info-row">
      <span>Phone</span>
      <strong id="profilePhone" class="skeleton-text skeleton-value"></strong>
    </div>

    <div class="info-row">
      <span>Role</span>
      <strong id="profileRole" class="skeleton-text skeleton-value"></strong>
    </div>

  </section>

  <!-- ACTIVE REPAIRS -->
  <section class="card">

    <h2>Active Repairs</h2>

    <div id="repairsContainer">
      No repairs found
    </div>

  </section>
  <!-- REPAIR JOURNEY -->
<section class="card">

  <h2>Repair Journey</h2>

  <div id="repairJourney">
    Select a repair to view progress.
  </div>

</section>
  <!-- RECENT ACTIVITY -->
  <section class="card">

    <h2>Recent Activity</h2>

    <div id="activityFeed">
      No activity yet
    </div>

  </section>

</div>
<div id="editProfileModal" class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Edit Profile</h2>

      <button onclick="closeEditProfile()">
        ✕
      </button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" id="editName">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" id="editPhone">
    </div>

    <div class="form-group">
      <label>Location</label>
      <input type="text" id="editLocation">
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea id="editBio"></textarea>
    </div>

    <button
      class="primary-btn"
      onclick="saveProfile()"
    >
      Save Changes
    </button>

  </div>

</div>

<script type="module" src="user-profile.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
</body>
</html>
