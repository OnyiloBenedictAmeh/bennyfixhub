<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BennyFix Technician</title>
  <link rel="icon" type="image/png" sizes="512x512" href="bennyfix hub white-logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="technician.css">
</head>
<body>
  <main id="techApp" class="tech-app">
    <section id="techLoading" class="tech-loading">
      <div class="loader-card">
        <i class="bx bx-wrench"></i>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <section id="techDashboard" class="tech-dashboard hidden">
      <aside class="tech-sidebar">
        <div class="brand">
          <img src="bennyfix hub white-logo.png" alt="BennyFix Hub">
          <div>
            <strong>BennyFix Hub</strong>
            <small>Technician</small>
          </div>
        </div>

        <button class="active" onclick="showTechSection('overview')" id="nav-overview">
          <i class="bx bxs-dashboard"></i>
          <span>Overview</span>
        </button>
        <button onclick="showTechSection('repairs')" id="nav-repairs">
          <i class="bx bx-wrench"></i>
          <span>Assigned Repairs</span>
        </button>
        <button onclick="showTechSection('profile')" id="nav-profile">
          <i class="bx bx-user"></i>
          <span>Profile</span>
        </button>

        <div class="sidebar-actions">
          <button onclick="toggleTechTheme()">
            <i class="bx bx-moon"></i>
            <span>Dark Mode</span>
          </button>
          <button onclick="logoutTechnician()">
            <i class="bx bx-log-out"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <section class="tech-main">
        <header class="tech-topbar">
          <div class="tech-profile">
            <img id="techAvatar" alt="Technician avatar">
            <div>
              <h1 id="techName">Technician</h1>
              <p id="techEmail">Loading account...</p>
            </div>
          </div>

          <label class="availability-control">
            <span>Availability</span>
            <select id="availabilitySelect" onchange="updateAvailability(this.value)">
              <option value="available">Available</option>
              <option value="busy">Busy</option>
              <option value="offline">Offline</option>
            </select>
          </label>
        </header>

        <section id="overview" class="tech-section">
          <div class="stats-grid">
            <article class="stat-card">
              <i class="bx bx-clipboard"></i>
              <div>
                <h2 id="assignedCount">0</h2>
                <p>Assigned</p>
              </div>
            </article>
            <article class="stat-card active">
              <i class="bx bx-loader-circle"></i>
              <div>
                <h2 id="activeCount">0</h2>
                <p>Active</p>
              </div>
            </article>
            <article class="stat-card completed">
              <i class="bx bx-check-circle"></i>
              <div>
                <h2 id="completedCount">0</h2>
                <p>Completed</p>
              </div>
            </article>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2>Recent Assignments</h2>
              <button onclick="showTechSection('repairs')">View all</button>
            </div>
            <div id="recentRepairs" class="repair-list"></div>
          </div>
        </section>

        <section id="repairs" class="tech-section hidden">
          <div class="panel">
            <div class="panel-header">
              <h2>Assigned Repairs</h2>
              <span id="repairSummary">0 jobs</span>
            </div>
            <div id="assignedRepairs" class="repair-list"></div>
          </div>
        </section>

        <section id="profile" class="tech-section hidden">
          <div class="profile-panel">
            <img id="profileAvatar" alt="Profile avatar">
            <h2 id="profileName">Technician</h2>
            <p id="profileRole">Technician</p>

            <div class="profile-grid">
              <div>
                <span>Email</span>
                <strong id="profileEmail">Not set</strong>
              </div>
              <div>
                <span>Phone</span>
                <strong id="profilePhone">Not set</strong>
              </div>
              <div>
                <span>Location</span>
                <strong id="profileLocation">Not set</strong>
              </div>
              <div>
                <span>Status</span>
                <strong id="profileAvailability">Available</strong>
              </div>
            </div>
          </div>
        </section>
      </section>
    </section>
  </main>

  <div id="noteModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" onclick="closeNoteModal()">×</button>
      <h3>Add Repair Note</h3>
      <p id="noteRepairTitle">Repair update</p>
      <textarea id="repairNote" placeholder="Write a short update for this repair"></textarea>
      <button onclick="saveRepairNote()" class="primary-btn">Save Note</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="technician.js"></script>
</body>
</html>
