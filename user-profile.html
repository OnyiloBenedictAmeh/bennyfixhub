<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BennyFix Hub Profile</title>
<link rel="icon" type="image/png" sizes="512x512" href="/bennyfix hub white-logo.png" />
  <link rel="stylesheet" href="user-profile.css">
</head>
<body>

<div class="profile-page">

  <!-- COVER -->
  <section class="profile-cover">
    <img id="coverImg" alt="Cover Photo">
  </section>

  <!-- PROFILE HEADER -->
  <section class="profile-header">
    <div class="profile-completion">

  <div class="progress-bar">
    <div
      id="profileProgress"
      class="progress-fill">
    </div>
  </div>

  <p id="profileProgressText">
    Profile Complete
  </p>

</div>

    <div class="avatar-wrap">
      <img
        id="profileAvatar"
        class="avatar"
        alt="Profile Picture"
      >
    </div>

    <div class="profile-info">

      <h1 id="profileName">
        Loading...
      </h1>

      <p id="profileBio">
        Loading profile...
      </p>

      <div class="profile-meta">

        <span id="profileLocation">
          Loading...
        </span>

        <span id="profileJoined">
          Loading...
        </span>

      </div>

      <button
  id="editProfileBtn"
  class="primary-btn"
  onclick="openEditProfile()"
>
  Edit Profile
</button>

    </div>

  </section>

  <!-- STATS -->
  <section class="stats-grid">

    <div class="stat-card">
      <h2 id="repairCount">0</h2>
      <p>Repairs</p>
    </div>

    <div class="stat-card">
      <h2 id="completedCount">0</h2>
      <p>Completed</p>
    </div>

    <div class="stat-card">
      <h2 id="claimCount">0</h2>
      <p>Claims</p>
    </div>

    <div class="stat-card">
      <h2 id="hireCount">0</h2>
      <p>Hire Requests</p>
    </div>

  </section>

  <!-- ACCOUNT INFO -->
  <section class="card">

    <h2>Account Information</h2>

    <div class="info-row">
      <span>Email</span>
      <strong id="profileEmail"></strong>
    </div>

    <div class="info-row">
      <span>Phone</span>
      <strong id="profilePhone"></strong>
    </div>

    <div class="info-row">
      <span>Role</span>
      <strong id="profileRole"></strong>
    </div>

  </section>

  <!-- ACTIVE REPAIRS -->
  <section class="card">

    <h2>Active Repairs</h2>

    <div id="repairsContainer">
      No repairs found
    </div>

  </section>
  <!-- REPAIR JOURNEY -->
<section class="card">

  <h2>Repair Journey</h2>

  <div id="repairJourney">
    Select a repair to view progress.
  </div>

</section>
  <!-- RECENT ACTIVITY -->
  <section class="card">

    <h2>Recent Activity</h2>

    <div id="activityFeed">
      No activity yet
    </div>

  </section>

</div>
<div id="editProfileModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Edit Profile</h2>

      <button onclick="closeEditProfile()">
        ✕
      </button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" id="editName">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" id="editPhone">
    </div>

    <div class="form-group">
      <label>Location</label>
      <input type="text" id="editLocation">
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea id="editBio"></textarea>
    </div>

    <button
      class="primary-btn"
      onclick="saveProfile()"
    >
      Save Changes
    </button>

  </div>

</div>
<script type="module" src="user-profile.js"></script>

</body>
</html>
